name: Update easyauto123 inventory

on:
  schedule:
    - cron: '0 0 * * 1' # every Monday UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest inventory + Wayback historical snapshots
        run: python scripts/fetch_inventory.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.csv data/inventory.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update easyauto123 inventory data"
          git push
