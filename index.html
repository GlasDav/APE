<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>easyauto123 Inventory Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; margin: 0; background:#f6f8fb; color:#1f2937; }
    .wrap { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:1rem 1.25rem; box-shadow:0 1px 2px rgba(0,0,0,.05); }
    .meta { display:flex; gap:1rem; flex-wrap:wrap; margin:.75rem 0 1rem; font-size:.95rem; color:#374151; }
    canvas { max-height: 480px; }
    code { background:#eef2ff; padding:.1rem .35rem; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>easyauto123 Used Car Inventory Tracker</h1>
    <p>Inventory is pulled from <code>https://easyauto123.com.au/buy/used-cars?page=1&amp;limit=20</code> and parsed from the heading like “#### used cars for sale”.</p>
    <div class="card">
      <div class="meta">
        <div><strong>Latest Inventory:</strong> <span id="latestInventory">Loading...</span></div>
        <div><strong>Latest Date:</strong> <span id="latestDate">Loading...</span></div>
        <div><strong>Total Data Points:</strong> <span id="totalPoints">Loading...</span></div>
      </div>
      <canvas id="inventoryChart"></canvas>
    </div>
  </div>

<script>
async function main() {
  const res = await fetch('./data/inventory.json', { cache: 'no-store' });
  const data = await res.json();
  const labels = data.map(d => d.date);
  const values = data.map(d => d.inventory);
  const latest = data[data.length - 1] || { date: 'N/A', inventory: 'N/A' };

  document.getElementById('latestInventory').textContent = latest.inventory;
  document.getElementById('latestDate').textContent = latest.date;
  document.getElementById('totalPoints').textContent = data.length;

  const ctx = document.getElementById('inventoryChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Used cars for sale',
        data: values,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,.15)',
        fill: true,
        pointRadius: 3,
        tension: 0.2
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { title: { display: true, text: 'Inventory count' } },
        x: { title: { display: true, text: 'Date' } }
      }
    }
  });
}
main();
</script>
</body>
</html>
